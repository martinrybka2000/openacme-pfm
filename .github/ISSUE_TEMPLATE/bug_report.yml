name: Bug report
description: Report a problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Mains voltage** — do not attach or post photos of live wiring. Be safe.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. v0.1.0 or commit sha"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - firmware
        - hardware
        - software (host app)
        - docs
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
